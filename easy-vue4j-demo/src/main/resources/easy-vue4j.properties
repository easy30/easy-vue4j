# ===========================================
# easy-vue4j 配置文件
# ===========================================
# 说明：
#   - 此配置文件在应用启动时读取
#   - env 参数通过 FilterConfig 的 init-parameter 传入
#   - 其他配置项在此文件中定义
# ===========================================

# -------------------------------------------
# 基础配置
# -------------------------------------------

# 默认首页文件名（访问目录时自动加载）
default.index=index.html

# Vue 文件扩展名
vue.ext=.vue

# 资源根路径（可选；不配置时使用缺省值 classpath:/static）
# classpath: 格式：classpath:/static
# 绝对路径：/path/to/static
# 相对路径：./src/main/resources/static
# 系统属性：java -Dvue4j.resource.root=xxx（优先级最高，-D 需带 vue4j. 前缀）
# resource.root=classpath:/static
#
# 说明：热更新由框架自动决定——resource.root 为本地文件路径（非 classpath:）
# 时才做热更新（改文件后刷新即生效）；classpath:/static 或打包成 jar 时使用缓存。
# 因此开发时若希望热更新，可将 resource.root 指向真实文件路径（如 src/main/resources/static）。

# -------------------------------------------
# Filter 排除配置
# -------------------------------------------
# 完全不经过 Filter 的资源（直接交给容器处理）
# 支持格式：
#   - 精确匹配：/favicon.ico
#   - 目录前缀：/images/*
#   - 后缀匹配：*.png
# 注意：PathMatcher 不支持 Ant 风格通配符 **，只有 *，目录前缀请用 /* 结尾
# -------------------------------------------
filter.exclude=/favicon.ico, /robots.txt, *.min.js, *.min.css

filter.exclude-no-ext=true

# -------------------------------------------
# esbuild 转译路径（可选）
# -------------------------------------------
# 用于 .ts / 装饰器 转译；不配置时会自动下载到 ~/.easy-vue4j/esbuild
# esbuild.path=/path/to/esbuild

