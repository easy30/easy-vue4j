# ===========================================
# easy-vue4j 配置文件
# ===========================================
# 说明：
#   - 此配置文件在应用启动时读取
#   - env 参数通过 FilterConfig 的 init-parameter 传入
#   - 其他配置项在此文件中定义
# ===========================================

# -------------------------------------------
# 基础配置
# -------------------------------------------

# 默认首页文件名（访问目录时自动加载）
default.index=index.html

# Vue 文件扩展名
vue.ext=.vue

# 资源根路径（可选，也可以通过 FilterConfig 覆盖）
# classpath: 格式：classpath:/static
# 绝对路径：/path/to/static
# 相对路径：./src/main/resources/static
resource.root=classpath:/static

# -------------------------------------------
# 热更新配置（按环境分组）
# -------------------------------------------
# 格式说明：
#   - 使用 Servlet 原生路径格式
#   - /* : 匹配所有路径
#   - /app/* : 匹配 /app/ 开头的所有路径
#   - *.js : 匹配所有.js 文件
#
# 判断逻辑：
#   1. 先检查 exclude，命中则 reload=false
#   2. 再检查 include，命中则 reload=true
#   3. 都不命中则使用默认值：
#      - dev 环境：reload=true
#      - prod 环境：reload=false
# -------------------------------------------

# 开发环境配置
dev.reload.include=/*
dev.reload.exclude=/vendor/js/*, /vendor/css/*, *.min.js, *.min.css

# 生产环境配置（留空表示全部不热更新）
prod.reload.include=
prod.reload.exclude=

# -------------------------------------------
# Filter 排除配置
# -------------------------------------------
# 完全不经过 Filter 的资源（直接交给容器处理）
# 支持格式：
#   - 精确匹配：/favicon.ico
#   - 目录前缀：/images/*
#   - 后缀匹配：*.png
# -------------------------------------------
filter.exclude=/favicon.ico, /robots.txt, \
               /images/*, /fonts/*, \
               *.png, *.jpg, *.gif, *.svg, \
               *.ico, *.woff, *.woff2, *.ttf, *.eot

# -------------------------------------------
# 缓存控制配置
# -------------------------------------------

# 缓存检查策略：timestamp(文件时间戳) | hash(内容哈希)
cache.strategy=timestamp

# 缓存检查间隔（毫秒），仅 reload=true 时有效
cache.check-interval=1000
