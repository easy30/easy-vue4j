# ===========================================
# easy-vue4j 配置文件
# ===========================================
# 说明：
#   - 此配置文件在应用启动时读取
#   - env 参数通过 FilterConfig 的 init-parameter 传入
#   - 其他配置项在此文件中定义
# ===========================================

# -------------------------------------------
# 基础配置
# -------------------------------------------

# 默认首页文件名（访问目录时自动加载）
default.index=index.html

# Vue 文件扩展名
vue.ext=.vue

# 资源根路径（按环境，可选，也可以通过 FilterConfig 覆盖）
# classpath: 格式：classpath:/static
# 绝对路径：/path/to/static
# 相对路径：./src/main/resources/static
# 系统属性：java -Ddev.resource.root=xxx（优先级最高）
dev.resource.root=classpath:/static

# -------------------------------------------
# 热更新开关（按环境）
# -------------------------------------------
# true=每个请求都重新读取文件（开发用）
# false=使用缓存（生产用）
# 如需排除特定路径不走 Filter，用 filter.exclude
# -------------------------------------------
dev.reload=true
prod.reload=false

# -------------------------------------------
# Filter 排除配置
# -------------------------------------------
# 完全不经过 Filter 的资源（直接交给容器处理）
# 支持格式：
#   - 精确匹配：/favicon.ico
#   - 目录前缀：/images/*
#   - 后缀匹配：*.png
# -------------------------------------------
filter.exclude=/favicon.ico, /robots.txt, *.min.js, *.min.css

